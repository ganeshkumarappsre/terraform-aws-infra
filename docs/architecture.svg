<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Project 1 — AWS Infrastructure Architecture</text>

  <!-- Internet Gateway -->
  <rect x="330" y="50" width="140" height="44" rx="6" fill="#f7931e" stroke="#c9700a" stroke-width="1.5"/>
  <text x="400" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Internet Gateway</text>
  <line x1="400" y1="94" x2="400" y2="118" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPC container -->
  <rect x="40" y="118" width="720" height="410" rx="10" fill="#eef4fb" stroke="#2f6fb0" stroke-width="2"/>
  <text x="60" y="140" font-size="14" font-weight="700" fill="#2f6fb0">VPC — 10.0.0.0/16</text>

  <!-- AZ-a column -->
  <rect x="65" y="155" width="330" height="355" rx="8" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="175" font-size="12" font-weight="600" fill="#5a6472">Availability Zone A</text>

  <!-- AZ-b column -->
  <rect x="405" y="155" width="330" height="355" rx="8" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="420" y="175" font-size="12" font-weight="600" fill="#5a6472">Availability Zone B</text>

  <!-- Public subnet A -->
  <rect x="85" y="190" width="290" height="120" rx="6" fill="#d6ecd9" stroke="#4a9e5c" stroke-width="1.5"/>
  <text x="100" y="210" font-size="12" font-weight="600" fill="#2f6b3c">Public Subnet — 10.0.1.0/24</text>

  <!-- EC2 box -->
  <rect x="105" y="225" width="240" height="65" rx="6" fill="#ffffff" stroke="#4a9e5c" stroke-width="1.5"/>
  <text x="225" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">EC2 Instance</text>
  <text x="225" y="265" text-anchor="middle" font-size="11" fill="#5a6472">t3.micro · Ubuntu</text>
  <text x="225" y="280" text-anchor="middle" font-size="10" fill="#8a94a2">SG: SSH (my IP) + HTTP</text>

  <!-- Public subnet B (standby, no EC2) -->
  <rect x="425" y="190" width="290" height="120" rx="6" fill="#d6ecd9" stroke="#4a9e5c" stroke-width="1.5" opacity="0.55"/>
  <text x="440" y="210" font-size="12" font-weight="600" fill="#2f6b3c">Public Subnet — 10.0.2.0/24</text>
  <text x="570" y="255" text-anchor="middle" font-size="11" fill="#5a6472" font-style="italic">(reserved for HA)</text>

  <!-- Private subnet A -->
  <rect x="85" y="335" width="290" height="150" rx="6" fill="#f4e3d3" stroke="#c9812f" stroke-width="1.5"/>
  <text x="100" y="355" font-size="12" font-weight="600" fill="#8a5717">Private Subnet — 10.0.11.0/24</text>

  <!-- Private subnet B -->
  <rect x="425" y="335" width="290" height="150" rx="6" fill="#f4e3d3" stroke="#c9812f" stroke-width="1.5"/>
  <text x="440" y="355" font-size="12" font-weight="600" fill="#8a5717">Private Subnet — 10.0.12.0/24</text>

  <!-- RDS box spanning both private subnets -->
  <rect x="185" y="390" width="430" height="70" rx="6" fill="#ffffff" stroke="#c9812f" stroke-width="1.5"/>
  <text x="400" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">RDS Instance (MySQL 8.0)</text>
  <text x="400" y="428" text-anchor="middle" font-size="11" fill="#5a6472">db.t3.micro · Single-AZ (multi_az = false)</text>
  <text x="400" y="442" text-anchor="middle" font-size="10" fill="#8a94a2">DB Subnet Group spans both AZs — no active standby</text>
  <text x="400" y="455" text-anchor="middle" font-size="10" fill="#8a94a2">SG: allows 3306 only from EC2 security group</text>

  <!-- EC2 -> RDS connection -->
  <line x1="225" y1="290" x2="225" y2="315" stroke="#555" stroke-width="1.5"/>
  <line x1="225" y1="315" x2="400" y2="315" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="315" x2="400" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="333" font-size="10" fill="#5a6472">3306/tcp (SG reference)</text>

  <!-- Route table note -->
  <text x="60" y="540" font-size="10" fill="#8a94a2">Public subnets route 0.0.0.0/0 → Internet Gateway. Private subnets have no internet route.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
